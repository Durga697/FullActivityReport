name: Daily Whizzard Remarks

on:
  schedule:
    # GitHub Actions cron uses UTC. 04:30 UTC = 10:00 AM IST.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-whizzard-remarks
  cancel-in-progress: false

jobs:
  run-remarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run remarks automation
        env:
          WHIZZARD_MOBILE: ${{ secrets.WHIZZARD_MOBILE }}
          WHIZZARD_PASSWORD: ${{ secrets.WHIZZARD_PASSWORD }}
          TZ: Asia/Kolkata
        run: python whizzard_remarks.py

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remarks-audit-${{ github.run_number }}
          path: |
            processed_log.csv
            automation_failure.png
          if-no-files-found: warn
          retention-days: 30
